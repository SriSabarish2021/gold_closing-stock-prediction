# render.yaml — deploy this backend to Render.com (free tier)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: stockpulse-ml-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: true
